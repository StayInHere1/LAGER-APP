<!DOCTYPE html>
<html lang="de" data-theme="dark" data-textcolor="auto" data-fontsize="normal" data-contrastbooster="false">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warenerfassung & Bestandsprüfung</title>
    
    <!-- FIREBASE SDKs (Web / Cloud) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --danger: #dc2626;
            --warning: #d97706;
            --whatsapp: #25d366;
            --whatsapp-dark: #128c7e;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #ffffff;
            --text-secondary: #94a3b8;
            --border: #334155;
            --radius: 12px;
            --base-font: 16px;
            --btn-height: 52px;
            --font-weight-normal: 400;
            --font-weight-bold: 600;
        }

        /* ERSCHEINUNGSBILD / THEMES */
        [data-theme="light"] {
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #ffffff;
            --text-secondary: #94a3b8;
            --border: #334155;
        }

        [data-theme="grey"] {
            --bg: #334155;
            --surface: #475569;
            --text: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #64748b;
        }

        [data-theme="oled"] {
            --bg: #000000;
            --surface: #000000;
            --text: #ffffff;
            --text-secondary: #a1a1aa;
            --border: #27272a;
            --primary: #3b82f6;
        }

        [data-theme="contrast"] {
            --bg: #000000;
            --surface: #121212;
            --text: #ffffff;
            --text-secondary: #facc15;
            --border: #ffffff;
            --primary: #facc15;
            --danger: #ff0000;
        }

        /* GALAXY DESIGN */
        [data-theme="galaxy"] {
            --bg: #090514;
            --surface: #130a2a;
            --text: #e0e7ff;
            --text-secondary: #a5b4fc;
            --border: #3b1d82;
            --primary: #d946ef;
            --primary-dark: #c026d3;
            background: radial-gradient(circle at top left, #2e1065, #090514 60%, #1e1b4b);
            background-attachment: fixed;
        }

        [data-theme="galaxy"] .card, [data-theme="galaxy"] header, [data-theme="galaxy"] .nav-bar {
            background: rgba(19, 10, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #6366f1;
            box-shadow: 0 0 15px rgba(217, 70, 239, 0.25);
        }

        [data-theme="galaxy"] .btn {
            background: linear-gradient(135deg, #d946ef, #06b6d4);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
            color: #ffffff;
        }

        /* CAMOUFLAGE DESIGN */
        [data-theme="camouflage"] {
            --bg: #1a2419;
            --surface: #283526;
            --text: #f0fdf4;
            --text-secondary: #86efac;
            --border: #3b4e38;
            --primary: #15803d;
            --primary-dark: #166534;
        }

        /* SUNSET CYBERPUNK DESIGN */
        [data-theme="sunset"] {
            --bg: #180828;
            --surface: #2a0e44;
            --text: #fff1f2;
            --text-secondary: #f472b6;
            --border: #701a75;
            --primary: #ea580c;
            --primary-dark: #c2410c;
            background: radial-gradient(circle at bottom right, #831843, #180828 70%);
            background-attachment: fixed;
        }

        [data-theme="sunset"] .btn {
            background: linear-gradient(135deg, #f97316, #ec4899);
            color: #ffffff;
        }

        /* SCHRIFTFARBEN AUSWAHL */
        [data-textcolor="white"] {
            --text: #ffffff !important;
            --text-secondary: #cbd5e1 !important;
        }
        [data-textcolor="lightblue"] {
            --text: #38bdf8 !important;
            --text-secondary: #7dd3fc !important;
        }
        [data-textcolor="yellow"] {
            --text: #facc15 !important;
            --text-secondary: #fde047 !important;
        }
        [data-textcolor="matrixgreen"] {
            --text: #22c55e !important;
            --text-secondary: #4ade80 !important;
        }
        [data-textcolor="signalorange"] {
            --text: #f97316 !important;
            --text-secondary: #fb923c !important;
        }

        [data-contrastbooster="true"] {
            --font-weight-normal: 600;
            --font-weight-bold: 900;
        }

        [data-fontsize="small"] { --base-font: 14px; }
        [data-fontsize="normal"] { --base-font: 16px; }
        [data-fontsize="large"] { --base-font: 18px; }
        [data-fontsize="xlarge"] { --base-font: 20px; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: var(--font-weight-normal);
        }

        strong, b, h1, h2, h3, h4, label, .btn {
            font-weight: var(--font-weight-bold);
        }

        html {
            font-size: var(--base-font);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 90px;
            max-width: 600px;
            margin: 0 auto;
            transition: background-color 0.2s, color 0.2s;
        }

        /* LOCK SCREEN OVERLAY */
        #lockScreenOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            z-index: 1000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lock-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            width: 100%;
            max-width: 420px;
            border: 2px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        header {
            background: var(--surface);
            padding: 1rem;
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 1.35rem;
            color: var(--text);
        }

        .container {
            padding: 1rem;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            border: 2px solid var(--border);
        }

        .card h3 {
            font-size: 1.15rem;
            margin-bottom: 0.8rem;
        }

        .form-group {
            margin-bottom: 1.1rem;
        }

        label {
            display: block;
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        input, select, textarea {
            width: 100%;
            min-height: var(--btn-height);
            padding: 0.85rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1.05rem;
            background: var(--surface);
            color: var(--text);
        }

        textarea {
            resize: none;
            min-height: 90px;
        }

        /* DYNAMISCHER AT-NUMMER INPUT MIT FESTEM AT- PREFIX */
        .at-input-wrapper {
            display: flex;
            align-items: center;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            overflow: hidden;
        }

        .at-prefix {
            padding: 0 0.85rem;
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--primary);
            background: rgba(37, 99, 235, 0.1);
            min-height: var(--btn-height);
            display: flex;
            align-items: center;
            border-right: 2px solid var(--border);
            user-select: none;
        }

        .at-input-wrapper input {
            border: none !important;
            border-radius: 0 !important;
            background: transparent !important;
        }

        .dictate-wrapper {
            position: relative;
            display: flex;
            gap: 8px;
        }

        .dictate-btn {
            width: 55px;
            min-height: var(--btn-height);
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .photo-picker {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 1.2rem;
            text-align: center;
            background: var(--bg);
            cursor: pointer;
            margin-bottom: 0.75rem;
        }

        .photo-preview-grid {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            margin-top: 12px;
            padding: 4px;
        }

        .photo-thumb-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .photo-thumb-wrapper img {
            width: 85px;
            height: 85px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--border);
            display: block;
        }

        .remove-photo-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .btn {
            width: 100%;
            min-height: var(--btn-height);
            padding: 0.85rem;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-size: 1.05rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-whatsapp {
            background: var(--whatsapp);
            color: white !important;
            margin-top: 12px;
        }

        .btn-danger {
            background: var(--danger);
            color: white !important;
            margin-top: 12px;
        }

        .btn-secondary {
            background: #64748b;
            color: white !important;
            margin-top: 8px;
        }

        .btn-sm {
            min-height: 36px;
            padding: 4px 10px;
            font-size: 0.85rem;
            width: auto;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            display: flex;
            border-top: 2px solid var(--border);
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            padding: 0.85rem 0;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .item-card {
            display: flex;
            gap: 14px;
            align-items: center;
            padding: 0.85rem;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            position: relative;
        }

        .item-card img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            background: var(--primary);
            color: white;
            margin-right: 6px;
        }

        .badge-status {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .badge-full {
            background: #dcfce7;
            color: #166534;
        }

        .badge-partial {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-30d {
            background: #ffedd5;
            color: #c2410c;
            border: 1px solid #f97316;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            margin-left: 4px;
            font-weight: bold;
        }

        .badge-old {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            margin-left: 4px;
            font-weight: bold;
        }

        .user-list-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .user-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .user-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 6px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            padding: 16px;
            overflow-y: auto;
        }

        .modal-content {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 18px;
            max-width: 500px;
            margin: 20px auto;
            position: relative;
            border: 2px solid var(--border);
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 1.8rem;
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
        }

        .modal-gallery {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 14px;
        }

        .modal-gallery img {
            width: 100%;
            max-height: 320px;
            object-fit: contain;
            border-radius: 8px;
            background: #000;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .cloud-badge {
            font-size: 0.75rem;
            background: #dcfce7;
            color: #166534;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-left: 8px;
        }

        .device-badge {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            margin-top: 4px;
        }

        .device-badge-online {
            background: #dcfce7;
            color: #166534;
        }

        .device-badge-offline {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>

    <!-- ANMELDE-OVERLAY (LOCKSCREEN) -->
    <div id="lockScreenOverlay">
        <div class="lock-card">
            <h2 style="margin-bottom:6px; text-align:center;">🔒 LagerDoku Login</h2>
            <p style="text-align:center; color:var(--text-secondary); font-size:0.85rem; margin-bottom:20px;">
                Bitte melde dich mit deiner Mitarbeiter-PIN und deinem Passwort an.
            </p>

            <form id="lockForm" onsubmit="handleLockLogin(event)">
                <div class="form-group">
                    <label>Mitarbeiter-PIN</label>
                    <input type="password" id="lockPinInput" placeholder="PIN z. B. 21201" required>
                </div>
                <div class="form-group">
                    <label>Passwort</label>
                    <input type="password" id="lockPasswordInput" placeholder="Passwort eingeben" required>
                </div>
                <button type="submit" class="btn">Entsperren & Anmelden</button>
            </form>
            <p id="lockErrorMsg" style="color:var(--danger); font-size:0.85rem; text-align:center; margin-top:12px; display:none;"></p>
        </div>
    </div>

    <header>
        <h1>Erfassung <span id="cloudStatusBadge" class="cloud-badge">☁️ Live Cloud verknüpft</span></h1>
    </header>

    <div class="container">
        <!-- TAB 1: ERFASSUNG -->
        <div id="tab-erfassen" class="tab-content active">
            <div class="card">
                <form id="entryForm">
                    <div class="form-group">
                        <label>Fotos der Ware / Palette (Mehrere Aufnahmen nacheinander möglich)</label>
                        <input type="file" id="photoInput" accept="image/*" multiple capture="environment" style="display: none;" onchange="handleFileSelect(event)">
                        <div class="photo-picker" onclick="document.getElementById('photoInput').click()">
                            <span>📷 Fotos aufnehmen / hinzufügen</span>
                        </div>
                        <div class="photo-preview-grid" id="previewGrid"></div>
                    </div>

                    <div class="form-group">
                        <label for="atNummer">AT-Nummer (Nur Zahlen eingeben)</label>
                        <div class="at-input-wrapper">
                            <span class="at-prefix">AT-</span>
                            <input type="number" id="atNummer" pattern="[0-9]*" inputmode="numeric" placeholder="z. B. 998877" required oninput="filterNumbersOnly(this)">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="bereich">Bereich</label>
                        <select id="bereich">
                            <option value="LB">LB – Lagerbüro</option>
                            <option value="KZ">KZ – Kommissionszaun</option>
                            <option value="KT">KT – Kommissionstür</option>
                            <option value="KF">KF – Kommissionsfliesen</option>
                            <option value="TB">TB – Tiefbau</option>
                            <option value="HR3">HR3 – Holzregal 3</option>
                            <option value="KPR">KPR – Kommissionsplatz Regal</option>
                            <option value="KPR1">KPR1 – Kommissionsplatz R1</option>
                            <option value="KPR2">KPR2 – Kommissionsplatz R2</option>
                            <option value="KPR3">KPR3 – Kommissionsplatz R3</option>
                            <option value="KPR4">KPR4 – Kommissionsplatz R4</option>
                      <script>
        // FIREBASE INITIALISIERUNG
        const firebaseConfig = {
            apiKey: "AIzaSyDOGEf-5ia3AM6ZxnVI4CUc_l0wZAVyteI",
            authDomain: "lager-app-8410c.firebaseapp.com",
            projectId: "lager-app-8410c",
            storageBucket: "lager-app-8410c.firebasestorage.app",
            messagingSenderId: "258552990939",
            appId: "1:258552990939:web:e68e4bc244ca7b38a010fe",
            measurementId: "G-4C6EHP60XF"
        };

        firebase.initializeApp(firebaseConfig);
        const cloudDb = firebase.firestore();

        // GERÄTE-ID FÜR LIVE-STATUS
        let myDeviceId = localStorage.getItem('app_device_id');
        if (!myDeviceId) {
            myDeviceId = 'dev_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
            localStorage.setItem('app_device_id', myDeviceId);
        }

        let currentPhotos = [];
        let isSuperAdmin = false;
        let currentUser = null;
        let selectedItem = null;
        let enableVibration = true;
        let enableSound = true;
        let enableTurboMode = false;

        let adminMasterCode = localStorage.getItem('waren_admin_code') || '9999';

        const defaultUsers = [
            { id: 1, name: 'Florian Nienberg', pin: '21201', password: 'Admin2026!', tempPass: null, role: 'admin', isOwner: true, isLocked: false, devices: [] },
            { id: 2, name: 'Jan Zocher', pin: '21202', password: null, tempPass: null, role: 'lagerist', isOwner: false, isLocked: false, devices: [] },
            { id: 3, name: 'Manny Huppert', pin: '21203', password: null, tempPass: null, role: 'lagerist', isOwner: false, isLocked: false, devices: [] },
            { id: 4, name: 'Tommy Böckenhauer', pin: '21204', password: null, tempPass: null, role: 'lagerist', isOwner: false, isLocked: false, devices: [] },
            { id: 5, name: 'Lukas Dumke', pin: '21205', password: null, tempPass: null, role: 'lagerist', isOwner: false, isLocked: false, devices: [] },
            { id: 6, name: 'Benny Vetter', pin: '21206', password: null, tempPass: null, role: 'lagerist', isOwner: false, isLocked: false, devices: [] }
        ];

        let users = [...defaultUsers];
        let db = [];
        let trashDb = [];

        // INITIALE PRÜFUNG DES ANMELDESTATUS
        const savedUserId = localStorage.getItem('logged_user_id');
        if (!savedUserId) {
            document.getElementById('lockScreenOverlay').style.display = 'flex';
        }

        function filterNumbersOnly(input) {
            input.value = input.value.replace(/[^0-9]/g, '');
        }

        // BENUTZER-EINSTELLUNGEN GELADEN
        function loadSavedAppSettings() {
            const savedTheme = localStorage.getItem('app_theme') || 'dark';
            const savedColor = localStorage.getItem('app_textcolor') || 'auto';
            const savedFontSize = localStorage.getItem('app_fontsize') || 'normal';
            const savedBooster = localStorage.getItem('app_contrastbooster') || 'false';
            const savedVibe = localStorage.getItem('app_vibration');
            const savedSound = localStorage.getItem('app_sound');
            const savedTurbo = localStorage.getItem('app_turbomode');

            enableVibration = (savedVibe !== null) ? (savedVibe === 'true') : true;
            enableSound = (savedSound !== null) ? (savedSound === 'true') : true;
            enableTurboMode = (savedTurbo !== null) ? (savedTurbo === 'true') : false;

            document.documentElement.setAttribute('data-theme', savedTheme);
            document.documentElement.setAttribute('data-textcolor', savedColor);
            document.documentElement.setAttribute('data-fontsize', savedFontSize);
            document.documentElement.setAttribute('data-contrastbooster', savedBooster);

            const themeSel = document.getElementById('themeSelect');
            const colorSel = document.getElementById('textColorSelect');
            const fontSel = document.getElementById('fontSelect');
            const boosterSel = document.getElementById('boosterSelect');
            const vibeSel = document.getElementById('vibeSelect');
            const soundSel = document.getElementById('soundSelect');
            const turboSel = document.getElementById('turboSelect');

            if(themeSel) themeSel.value = savedTheme;
            if(colorSel) colorSel.value = savedColor;
            if(fontSel) fontSel.value = savedFontSize;
            if(boosterSel) boosterSel.value = savedBooster;
            if(vibeSel) vibeSel.value = enableVibration ? 'true' : 'false';
            if(soundSel) soundSel.value = enableSound ? 'true' : 'false';
            if(turboSel) turboSel.value = enableTurboMode ? 'true' : 'false';
        }

        loadSavedAppSettings();

        // 1. ECHTZEIT-SYNCHRONISATION BENUTZER & PASSWÖRTER & GERÄTE CLOUD
        cloudDb.collection("users").onSnapshot((snapshot) => {
            if(snapshot.empty) {
                defaultUsers.forEach(u => cloudDb.collection("users").doc(String(u.id)).set(u));
            } else {
                let cloudUsers = [];
                snapshot.forEach(doc => cloudUsers.push(doc.data()));
                users = cloudUsers;
                
                if(isSuperAdmin) {
                    renderUserRoleList();
                    renderAdminStats();
                }
                
                const savedId = localStorage.getItem('logged_user_id');
                if(savedId) {
                    const found = users.find(u => u.id == savedId);
                    const devList = found ? (found.devices || []) : [];
                    const isDeviceActive = devList.includes(myDeviceId);

                    if(found && !found.isLocked && isDeviceActive) {
                        currentUser = found;
                        document.getElementById('lockScreenOverlay').style.display = 'none';
                        updateLoginUI();
                    } else {
                        currentUser = null;
                        localStorage.removeItem('logged_user_id');
                        document.getElementById('lockScreenOverlay').style.display = 'flex';
                        updateLoginUI();
                    }
                } else {
                    document.getElementById('lockScreenOverlay').style.display = 'flex';
                }
            }
        });

        // 2. ECHTZEIT-SYNCHRONISATION BESTAND CLOUD
        cloudDb.collection("bestand").onSnapshot((snapshot) => {
            let cloudItems = [];
            snapshot.forEach((doc) => cloudItems.push(doc.data()));
            db = cloudItems;
            renderBestand();
            checkAT();
            if(isSuperAdmin) renderAdminStats();
        });

        function saveUserToCloud(user) {
            cloudDb.collection("users").doc(String(user.id)).set(user);
        }

        function triggerVibe() {
            if(enableVibration && navigator.vibrate) navigator.vibrate(50);
        }

        function playSuccessSound() {
            if(!enableSound) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e){}
        }

        function handleLockLogin(e) {
            e.preventDefault();
            const pin = document.getElementById('lockPinInput').value.trim();
            const pass = document.getElementById('lockPasswordInput').value.trim();
            const errDiv = document.getElementById('lockErrorMsg');
            errDiv.style.display = 'none';

            const user = users.find(u => u.pin === pin);
            if(!user) {
                errDiv.textContent = '❌ Falsche PIN.';
                errDiv.style.display = 'block';
                return;
            }

            if(user.isLocked) {
                errDiv.textContent = '❌ Dieser Zugang wurde gesperrt.';
                errDiv.style.display = 'block';
                return;
            }

            const isNormalMatch = user.password && (user.password === pass);
            const isTempMatch = user.tempPass && (user.tempPass === pass);

            if(isNormalMatch || isTempMatch) {
                triggerVibe();
                
                if(isTempMatch) {
                    user.tempPass = null;
                }

                if(!user.devices) user.devices = [];
                if(!user.devices.includes(myDeviceId)) {
                    user.devices.push(myDeviceId);
                }

                saveUserToCloud(user);

                currentUser = user;
                localStorage.setItem('logged_user_id', user.id);
                document.getElementById('lockScreenOverlay').style.display = 'none';
                document.getElementById('lockPinInput').value = '';
                document.getElementById('lockPasswordInput').value = '';
                updateLoginUI();

                if(enableTurboMode) {
                    setTimeout(() => document.getElementById('atNummer').focus(), 200);
                }
            } else {
                errDiv.textContent = '❌ Falsches Passwort oder Einmal-Passwort verfallen.';
                errDiv.style.display = 'block';
            }
        }

        function logoutCurrentUser() {
            triggerVibe();
            if(currentUser) {
                let devList = currentUser.devices || [];
                currentUser.devices = devList.filter(id => id !== myDeviceId);
                saveUserToCloud(currentUser);
            }
            currentUser = null;
            localStorage.removeItem('logged_user_id');
            document.getElementById('lockScreenOverlay').style.display = 'flex';
            updateLoginUI();
        }

        function updateLoginUI() {
            const statusText = document.getElementById('currentLoginStatus');
            if(currentUser) {
                statusText.innerHTML = `Angemeldet als: <strong>${currentUser.name}</strong> (${currentUser.role === 'admin' ? 'Admin / Verwalter' : 'Lagerist'})`;
            } else {
                statusText.innerHTML = `Status: <strong style="color:red;">Nicht angemeldet</strong>`;
            }
        }

        function verifySuperAdmin() {
            const code = document.getElementById('superAdminCodeInput').value;
            const statusText = document.getElementById('superAdminStatusText');
            if(code === adminMasterCode || (currentUser && currentUser.isOwner)) {
                triggerVibe();
                isSuperAdmin = true;
                statusText.style.color = 'var(--primary)';
                statusText.textContent = '✅ Haupt-Admin freigeschaltet!';
                document.getElementById('roleManagementArea').style.display = 'block';
                renderUserRoleList();
                renderAdminStats();
                renderTrashList();
            } else {
                isSuperAdmin = false;
                statusText.style.color = 'var(--danger)';
                statusText.textContent = '❌ Falsches Kennwort.';
            }
        }

        function changeAdminMasterPassword() {
            const newCode = document.getElementById('newAdminMasterPass').value.trim();
            if(newCode.length < 4) {
                alert('Das Admin-Kennwort muss mindestens 4 Zeichen lang sein.');
                return;
            }
            triggerVibe();
            adminMasterCode = newCode;
            localStorage.setItem('waren_admin_code', adminMasterCode);
            alert('Das Haupt-Admin-Kennwort wurde erfolgreich aktualisiert!');
            document.getElementById('newAdminMasterPass').value = '';
        }

        function renderUserRoleList() {
            const listDiv = document.getElementById('userRoleList');
            listDiv.innerHTML = users.map(u => {
                const devCount = (u.devices || []).length;
                const isOnline = devCount > 0;
                
                return `
                <div class="user-list-item">
                    <div class="user-list-header">
                        <div>
                            <strong>${u.name}</strong> (PIN: ${u.pin})<br>
                            <span class="device-badge ${isOnline ? 'device-badge-online' : 'device-badge-offline'}">
                                ${isOnline ? `🟢 Angemeldet (${devCount} ${devCount === 1 ? 'Gerät' : 'Geräte'})` : '🔴 Abgemeldet'}
                            </span>
                            <br>
                            <small style="color: var(--text-secondary);">
                                ${u.password ? '🟢 Festes PW' : (u.tempPass ? `🟠 Aktiv: <b>${u.tempPass}</b>` : '🔴 Kein PW')}
                            </small>
                        </div>
                        ${u.isOwner ? `
                            <span style="font-size:0.75rem; font-weight:bold; color:var(--primary); padding: 4px 8px; background: rgba(37,99,235,0.15); border-radius:6px;">Haupt-Admin</span>
                        ` : `
                            <select onchange="changeUserRole(${u.id}, this.value)" style="width: auto; min-height: 36px; padding:2px 6px;">
                                <option value="lagerist" ${u.role === 'lagerist' ? 'selected' : ''}>Lagerist</option>
                                <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
                            </select>
                        `}
                    </div>
                    ${!u.isOwner ? `
                        <div class="user-controls">
                            <button type="button" class="btn btn-sm btn-secondary" onclick="generateTempPassword(${u.id})">🔑 Einmal-PW generieren</button>
                            <button type="button" class="btn btn-sm btn-danger" onclick="adminLogoutUser(${u.id})">🚪 Live-Abmelden (${devCount})</button>
                        </div>
                    ` : ''}
                </div>
            `}).join('');
        }

        function generateTempPassword(userId) {
            const user = users.find(u => u.id === userId);
            if(!user) return;
            const randomPW = 'Pass' + Math.floor(1000 + Math.random() * 9000);
            user.tempPass = randomPW;
            user.password = null;
            user.isLocked = false;
            saveUserToCloud(user);
            triggerVibe();
            alert(`Einmal-Passwort für ${user.name} generiert:\n\nPasswort: ${randomPW}\n\nEs ist JETZT auf allen Handys gültig!`);
        }

        function adminLogoutUser(userId) {
            const user = users.find(u => u.id === userId);
            if(!user) return;
            user.tempPass = null;
            user.devices = [];
            saveUserToCloud(user);
            triggerVibe();
            alert(`${user.name} wurde live auf allen Geräten abgemeldet!`);
        }

        function renderAdminStats() {
            const statsDiv = document.getElementById('adminStatsArea');
            let counts = {};
            users.forEach(u => counts[u.name] = 0);
            db.forEach(item => {
                if(item.user) counts[item.user] = (counts[item.user] || 0) + 1;
            });

            statsDiv.innerHTML = users.map(u => `
                <div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom: 1px dashed var(--border);">
                    <span><strong>${u.name}</strong></span>
                    <span><strong>${counts[u.name] || 0} Erfassungen</strong></span>
                </div>
            `).join('');
        }

        function renderTrashList() {
            const trashDiv = document.getElementById('trashList');
            if(trashDb.length === 0) {
                trashDiv.innerHTML = '<p style="color:var(--text-secondary);">Papierkorb ist leer.</p>';
                return;
            }
            trashDiv.innerHTML = trashDb.map(item => `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; background:var(--bg); padding:6px; border-radius:6px;">
                    <span>${item.atNummer} (${item.bereich})</span>
                    <button class="btn btn-sm" onclick="restoreFromTrash(${item.id})">Wiederherstellen</button>
                </div>
            `).join('');
        }

        function restoreFromTrash(id) {
            const item = trashDb.find(x => x.id === id);
            if(!item) return;
            trashDb = trashDb.filter(x => x.id !== id);
            cloudDb.collection("bestand").doc(String(item.id)).set(item);
            renderTrashList();
            alert('Artikel wiederhergestellt!');
        }

        function changeUserRole(userId, newRole) {
            const user = users.find(u => u.id === userId);
            if(user && !user.isOwner) {
                triggerVibe();
                user.role = newRole;
                saveUserToCloud(user);
                alert(`Rolle von ${user.name} geändert.`);
            }
        }

        function startDictation() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Spracherkennung wird auf diesem Gerät leider nicht unterstützt.');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.interimResults = false;

            recognition.onstart = function() {
                alert('🎙 Höre zu... Jetzt sprechen.');
            };

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                const field = document.getElementById('hinweis');
                field.value = field.value ? field.value + ' ' + text : text;
                triggerVibe();
            };

            recognition.onerror = function() {
                alert('Fehler bei der Spracherkennung.');
            };

            recognition.start();
        }

                bodyText += `• ${item.atNummer} | ${item.bereich} | Status: ${item.status} | Angenommen von: ${item.user}\n`;
            });
            window.location.href = `mailto:florian.nienberg@example.com?subject=Tagesbericht%20Lagerbestand&body=${encodeURIComponent(bodyText)}`;
        }
